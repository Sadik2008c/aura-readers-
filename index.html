<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA READERS - Cyber Portal</title>
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        :root {
            --bg-main: #050b14;
            --bg-card: #0a1325;
            --neon-blue: #00f0ff;
            --neon-red: #ff3366;
            --neon-gold: #ffcc00;
            --neon-green: #00ff88;
            --text-muted: #8892b0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: linear-gradient(145deg, var(--bg-card), #070d1a);
            border: 1px solid rgba(0, 240, 255, 0.35);
            border-radius: 18px;
            padding: 30px 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
            text-align: center;
            position: relative;
        }

        .brand-logo {
            color: var(--neon-blue);
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .input-group { text-align: left; margin-bottom: 12px; }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--neon-blue);
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            background: #050b14;
            border: 1px solid #1e293b;
            color: #fff;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input { padding-right: 48px; }

        .monkey-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 22px;
            user-select: none;
        }

        #strengthSection {
            display: none;
            text-align: left;
            margin-top: -4px;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
        }

        .meter-container {
            width: 100%;
            height: 6px;
            background: #112240;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .strength-status {
            font-size: 11px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }

        .rules-checklist {
            list-style: none;
            margin-top: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .rules-checklist li.valid { color: var(--neon-green); }
        .rules-checklist li.invalid { color: var(--neon-red); }

        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .checkbox-container input { accent-color: var(--neon-blue); }

        .auth-btn {
            background: var(--neon-blue);
            color: #050b14;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            transition: 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .auth-btn:hover {
            background: #fff;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* Social Auth Buttons */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 18px 0;
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .divider span { padding: 0 10px; }

        .social-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-social {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-social:hover {
            border-color: var(--neon-blue);
            background: rgba(0, 240, 255, 0.1);
        }

        .switch-mode-text {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 15px;
            cursor: pointer;
        }

        .switch-mode-text span { color: var(--neon-blue); font-weight: 700; }

        /* Custom Popup Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
        }

        .popup-card {
            background: #0a1325;
            border: 2px solid var(--neon-blue);
            border-radius: 16px;
            padding: 25px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .popup-emoji { font-size: 45px; margin-bottom: 10px; }
        .popup-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .popup-msg { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; line-height: 1.4; }
        .popup-close-btn {
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-logo">AURA READERS</div>
        <div class="subtitle" id="formHeader">PORTAL LOGIN</div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)" autocomplete="on">
            
            <div id="signUpFields" style="display: none;">
                <div class="input-group">
                    <label>Display Name</label>
                    <input type="text" id="fullName" placeholder="e.g. 2x Sadik">
                </div>

                <div class="input-group">
                    <label>Valid Email (Spam Proof)</label>
                    <input type="email" id="userEmail" placeholder="yourname@gmail.com">
                </div>

                <div class="input-group">
                    <label>Target Goal</label>
                    <input type="text" id="targetGoal" placeholder="e.g. BUET / Medical">
                </div>
            </div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" id="userName" placeholder="Username (no spaces)" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="userPass" placeholder="Enter password" required>
                    <button type="button" class="monkey-btn" id="monkeyIcon" onclick="togglePasswordVisibility()">🙈</button>
                </div>
            </div>

            <div id="strengthSection">
                <div class="meter-container">
                    <div class="meter-fill" id="meterFill"></div>
                </div>
                <div class="strength-status">
                    <span id="strengthLabel" style="color: var(--neon-red);">WEAK</span>
                    <span id="scorePercent">0%</span>
                </div>
                <ul class="rules-checklist">
                    <li id="ruleLength" class="invalid">❌ Minimum 6 characters</li>
                    <li id="ruleUpper" class="invalid">❌ Uppercase letter (A-Z)</li>
                    <li id="ruleNumber" class="invalid">❌ Number (0-9)</li>
                    <li id="ruleSpecial" class="invalid">❌ Special character (@, #, $, etc.)</li>
                </ul>
            </div>

            <div class="options-row">
                <label class="checkbox-container">
                    <input type="checkbox" id="savePasswordCheck">
                    <span>Save password</span>
                </label>
                <span style="color: var(--text-muted); cursor: pointer;" onclick="showPopup('🔑', 'Password Help', 'Contact admin on WhatsApp/Messenger to restore your account credentials.', '#ffcc00')">Forgot?</span>
            </div>

            <button type="submit" class="auth-btn" id="submitBtn">LOG IN</button>
        </form>

        <div class="divider"><span>OR CONTINUE WITH</span></div>

        <div class="social-btns">
            <button type="button" class="btn-social" onclick="loginWithGoogle()">
                🌐 Google
            </button>
            <button type="button" class="btn-social" onclick="loginWithFacebook()">
                📘 Facebook
            </button>
        </div>

        <div class="switch-mode-text" id="toggleSwitch" onclick="toggleAuthMode()">
            Don't have an account? <span>Sign Up</span>
        </div>
    </div>

    <!-- Custom Neon Alert Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="popup-card" id="popupCard">
            <div class="popup-emoji" id="popupEmoji">⚡</div>
            <div class="popup-title" id="popupTitle">Alert</div>
            <div class="popup-msg" id="popupMsg">Message here</div>
            <button class="popup-close-btn" id="popupCloseBtn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAG0Py4X5uCXy_qlswCe0hE8ci_iOzGc2M",
            authDomain: "aura-readers.firebaseapp.com",
            projectId: "aura-readers",
            storageBucket: "aura-readers.firebasestorage.app",
            messagingSenderId: "809779155847",
            appId: "1:809779155847:web:3eb0a9732f97f6ad503922",
            databaseURL: "https://aura-readers-default-rtdb.firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let isLoginState = true;
        let isStrongPassword = false;
        let popupCallback = null;

        // Custom Popup System
        function showPopup(emoji, title, msg, themeColor = "#00f0ff", callback = null) {
            document.getElementById('popupEmoji').innerText = emoji;
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupTitle').style.color = themeColor;
            document.getElementById('popupCard').style.borderColor = themeColor;
            document.getElementById('popupCloseBtn').style.backgroundColor = themeColor;
            document.getElementById('popupMsg').innerText = msg;
            popupCallback = callback;
            document.getElementById('customModal').style.display = "flex";
        }

        function closePopup() {
            document.getElementById('customModal').style.display = "none";
            if (popupCallback) {
                popupCallback();
                popupCallback = null;
            }
        }

        // Auto-fill saved credentials
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('aura_saved_user');
            const savedPass = localStorage.getItem('aura_saved_pass');
            if (savedUser && savedPass) {
                document.getElementById('userName').value = savedUser;
                document.getElementById('userPass').value = savedPass;
                document.getElementById('savePasswordCheck').checked = true;
            }
        });

        function togglePasswordVisibility() {
            const passInput = document.getElementById('userPass');
            const monkey = document.getElementById('monkeyIcon');
            if (passInput.type === "password") {
                passInput.type = "text";
                monkey.innerText = "🐵";
            } else {
                passInput.type = "password";
                monkey.innerText = "🙈";
            }
        }

        function toggleAuthMode() {
            isLoginState = !isLoginState;
            const passInput = document.getElementById('userPass');
            
            document.getElementById('formHeader').innerText = isLoginState ? "PORTAL LOGIN" : "CREATE ACCOUNT";
            document.getElementById('submitBtn').innerText = isLoginState ? "LOG IN" : "REGISTER ACCOUNT";
            document.getElementById('signUpFields').style.display = isLoginState ? "none" : "block";
            document.getElementById('strengthSection').style.display = isLoginState ? "none" : "block";
            
            document.getElementById('toggleSwitch').innerHTML = isLoginState ? 
                "Don't have an account? <span>Sign Up</span>" : "Already have an account? <span>Login</span>";

            passInput.type = "password";
            document.getElementById('monkeyIcon').innerText = "🙈";
            evaluatePasswordStrength();
        }

        const passInputField = document.getElementById('userPass');
        passInputField.addEventListener('input', evaluatePasswordStrength);
        passInputField.addEventListener('keyup', evaluatePasswordStrength);

        function evaluatePasswordStrength() {
            if (isLoginState) return;
            const val = passInputField.value;
            let checksPassed = 0;

            const hasLength = val.length >= 6;
            const hasUpper = /[A-Z]/.test(val);
            const hasNumber = /[0-9]/.test(val);
            const hasSpecial = /[^A-Za-z0-9]/.test(val);

            updateRuleElement('ruleLength', hasLength);
            updateRuleElement('ruleUpper', hasUpper);
            updateRuleElement('ruleNumber', hasNumber);
            updateRuleElement('ruleSpecial', hasSpecial);

            if (hasLength) checksPassed++;
            if (hasUpper) checksPassed++;
            if (hasNumber) checksPassed++;
            if (hasSpecial) checksPassed++;

            const fill = document.getElementById('meterFill');
            const label = document.getElementById('strengthLabel');
            const percent = document.getElementById('scorePercent');

            if (val.length === 0) {
                fill.style.width = "0%";
                label.innerText = "WEAK";
                label.style.color = "var(--neon-red)";
                percent.innerText = "0%";
                isStrongPassword = false;
                return;
            }

            if (checksPassed <= 1) {
                fill.style.width = "25%";
                fill.style.backgroundColor = "var(--neon-red)";
                label.innerText = "VERY WEAK";
                label.style.color = "var(--neon-red)";
                percent.innerText = "25%";
                isStrongPassword = false;
            } else if (checksPassed === 2 || checksPassed === 3) {
                fill.style.width = checksPassed === 2 ? "50%" : "75%";
                fill.style.backgroundColor = "var(--neon-gold)";
                label.innerText = "MEDIUM";
                label.style.color = "var(--neon-gold)";
                percent.innerText = checksPassed === 2 ? "50%" : "75%";
                isStrongPassword = false;
            } else if (checksPassed === 4) {
                fill.style.width = "100%";
                fill.style.backgroundColor = "var(--neon-green)";
                label.innerText = "STRONG 🔥";
                label.style.color = "var(--neon-green)";
                percent.innerText = "100%";
                isStrongPassword = true;
            }
        }

        function updateRuleElement(elemId, isValid) {
            const el = document.getElementById(elemId);
            if (isValid) {
                el.className = "valid";
                el.innerHTML = el.innerHTML.replace("❌", "✅");
            } else {
                el.className = "invalid";
                el.innerHTML = el.innerHTML.replace("✅", "❌");
            }
        }

        // Email syntax validation
        function isValidEmailAddress(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function handleAuthSubmit(e) {
            e.preventDefault();

            const user = document.getElementById('userName').value.trim().toLowerCase();
            const pass = document.getElementById('userPass').value.trim();
            const savePass = document.getElementById('savePasswordCheck').checked;
            const submitBtn = document.getElementById('submitBtn');

            if (!user || !pass) {
                showPopup("⚠️", "Missing Information", "Please enter both username and password!", "#ff3366");
                return;
            }

            if (user.includes(" ")) {
                showPopup("🚫", "Invalid Username", "Username cannot contain any spaces!", "#ff3366");
                return;
            }

            submitBtn.innerText = "CONNECTING...";

            if (isLoginState) {
                // Login Verification
                db.ref('users/' + user).once('value').then((snapshot) => {
                    submitBtn.innerText = "LOG IN";
                    if (snapshot.exists() && snapshot.val().password === pass) {
                        
                        if (savePass) {
                            localStorage.setItem('aura_saved_user', user);
                            localStorage.setItem('aura_saved_pass', pass);
                        } else {
                            localStorage.removeItem('aura_saved_user');
                            localStorage.removeItem('aura_saved_pass');
                        }

                        localStorage.setItem('auraCurrentUser', user);

                        // Master Admin / Database Admin Check
                        const isBoss = (user === "sadik1" || snapshot.val().role === "admin");
                        if (isBoss) {
                            localStorage.setItem('auraIsAdmin', 'true');
                            showPopup("👑", "ACCESS GRANTED BOSS", "Welcome Commander Sadik! Entering Aura Control Terminal...", "#00f0ff", () => {
                                window.location.href = "admin.html";
                            });
                        } else {
                            localStorage.setItem('auraIsAdmin', 'false');
                            showPopup("🔥", "WELCOME SCHOLAR", `Login successful! Good luck with your study session, @${user}.`, "#00ff88", () => {
                                window.location.href = "app.html";
                            });
                        }

                    } else {
                        showPopup("❌", "Authentication Failed", "Incorrect password or username. Please verify your credentials!", "#ff3366");
                    }
                }).catch(err => {
                    submitBtn.innerText = "LOG IN";
                    showPopup("⚠️", "Database Error", err.message, "#ff3366");
                });

            } else {
                // Register Verification
                const name = document.getElementById('fullName').value.trim();
                const email = document.getElementById('userEmail').value.trim();
                const target = document.getElementById('targetGoal').value.trim();

                if (!name) {
                    submitBtn.innerText = "REGISTER ACCOUNT";
                    showPopup("⚠️", "Missing Name", "Display Name is required to identify you.", "#ffcc00");
                    return;
                }

                if (!isValidEmailAddress(email)) {
                    submitBtn.innerText = "REGISTER ACCOUNT";
                    showPopup("📧", "Invalid Email", "Please provide a genuine verified email (e.g. @gmail.com) to stop spam!", "#ff3366");
                    return;
                }

                if (!isStrongPassword) {
                    submitBtn.innerText = "REGISTER ACCOUNT";
                    showPopup("🛡️", "Weak Password", "Please fulfill all 4 security rules before creating account.", "#ff3366");
                    return;
                }

                db.ref('users/' + user).once('value').then((snapshot) => {
                    if (snapshot.exists()) {
                        submitBtn.innerText = "REGISTER ACCOUNT";
                        showPopup("🚫", "Username Taken", "This username already belongs to another member. Pick another!", "#ff3366");
                    } else {
                        const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${user}`;
                        
                        db.ref('users/' + user).set({
                            password: pass,
                            name: name,
                            email: email,
                            target: target || "HSC Science",
                            avatar: avatarUrl,
                            xp: 0,
                            level: 1,
                            totalSeconds: 0,
                            squad: "None",
                            tasksCompleted: 0,
                            penaltyActive: false,
                            createdAt: new Date().toISOString()
                        }).then(() => {
                            if (savePass) {
                                localStorage.setItem('aura_saved_user', user);
                                localStorage.setItem('aura_saved_pass', pass);
                            }
                            submitBtn.innerText = "LOG IN";
                            showPopup("🎉", "ACCOUNT CREATED", "Your profile has been stored safely! Please proceed to login.", "#00ff88", () => {
                                toggleAuthMode();
                            });
                        });
                    }
                });
            }
        }

        // Social Logins
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then((result) => {
                const u = result.user.email.split('@')[0].replace(/[^a-zA-Z0-9]/g, "");
                localStorage.setItem('auraCurrentUser', u);
                showPopup("🌐", "Google Connected", `Welcome ${result.user.displayName}!`, "#00ff88", () => {
                    window.location.href = "app.html";
                });
            }).catch((err) => {
                showPopup("⚠️", "Google Auth Error", err.message, "#ff3366");
            });
        }

        function loginWithFacebook() {
            const provider = new firebase.auth.FacebookAuthProvider();
            auth.signInWithPopup(provider).then((result) => {
                const u = result.user.displayName.toLowerCase().replace(/[^a-zA-Z0-9]/g, "");
                localStorage.setItem('auraCurrentUser', u);
                showPopup("📘", "Facebook Connected", `Welcome ${result.user.displayName}!`, "#00ff88", () => {
                    window.location.href = "app.html";
                });
            }).catch((err) => {
                showPopup("⚠️", "Facebook Auth Error", err.message, "#ff3366");
            });
        }
    </script>
</body>
</html>
