<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA READERS - Authentication</title>
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-main: #050b14;
            --bg-card: #0a1325;
            --neon-blue: #00f0ff;
            --neon-red: #ff3366;
            --neon-gold: #ffcc00;
            --neon-green: #00ff88;
            --text-muted: #8892b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: linear-gradient(145deg, var(--bg-card), #070d1a);
            border: 1px solid rgba(0, 240, 255, 0.35);
            border-radius: 18px;
            padding: 32px 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
            text-align: center;
            position: relative;
        }

        .brand-logo {
            color: var(--neon-blue);
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 22px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--neon-blue);
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            background: #050b14;
            border: 1px solid #1e293b;
            color: #fff;
            padding: 13px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
        }

        /* Password container with Monkey Toggle */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .monkey-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 22px;
            user-select: none;
            transition: transform 0.2s;
            outline: none;
        }

        .monkey-btn:active {
            transform: scale(1.25);
        }

        /* Password Strength Box */
        #strengthSection {
            display: none;
            text-align: left;
            margin-top: -6px;
            margin-bottom: 14px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .meter-container {
            width: 100%;
            height: 6px;
            background: #112240;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .strength-status {
            font-size: 11px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }

        .rules-checklist {
            list-style: none;
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .rules-checklist li {
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rules-checklist li.valid {
            color: var(--neon-green);
        }

        .rules-checklist li.invalid {
            color: var(--neon-red);
        }

        /* Remember / Save password options */
        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 18px;
            padding: 0 2px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-container input {
            accent-color: var(--neon-blue);
            cursor: pointer;
        }

        .auth-btn {
            background: var(--neon-blue);
            color: #050b14;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            transition: 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .auth-btn:hover {
            background: #fff;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .switch-mode-text {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 20px;
            cursor: pointer;
        }

        .switch-mode-text span {
            color: var(--neon-blue);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-logo">AURA READERS</div>
        <div class="subtitle" id="formHeader">PORTAL LOGIN</div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)" autocomplete="on">
            
            <!-- Extra sign-up fields -->
            <div id="signUpFields" style="display: none;">
                <div class="input-group">
                    <label>Display Name</label>
                    <input type="text" id="fullName" name="name" placeholder="e.g. 2x Sadik" autocomplete="name">
                </div>

                <div class="input-group">
                    <label>Target Goal</label>
                    <input type="text" id="targetGoal" name="target" placeholder="e.g. BUET / Medical / DU" autocomplete="organization">
                </div>
            </div>

            <!-- Username field -->
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="userName" name="username" placeholder="Username (no spaces)" required autocomplete="username">
            </div>

            <!-- Password field with Monkey Toggle -->
            <div class="input-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="userPass" name="password" placeholder="Enter password" required autocomplete="current-password">
                    <button type="button" class="monkey-btn" id="monkeyIcon" onclick="togglePasswordVisibility()" title="Show/Hide">🙈</button>
                </div>
            </div>

            <!-- Real-time Password Strength Box (Active during Sign Up) -->
            <div id="strengthSection">
                <div class="meter-container">
                    <div class="meter-fill" id="meterFill"></div>
                </div>
                <div class="strength-status">
                    <span id="strengthLabel" style="color: var(--neon-red);">WEAK</span>
                    <span id="scorePercent">0%</span>
                </div>
                <ul class="rules-checklist">
                    <li id="ruleLength" class="invalid">❌ কমপক্ষে ৬ টি অক্ষর</li>
                    <li id="ruleUpper" class="invalid">❌ বড় হাতের অক্ষর (A-Z)</li>
                    <li id="ruleNumber" class="invalid">❌ অন্তত ১ টি সংখ্যা (0-9)</li>
                    <li id="ruleSpecial" class="invalid">❌ স্পেশাল চিহ্ন (@, #, $, %, ইত্যাদি)</li>
                </ul>
            </div>

            <!-- Save Password & Preferences -->
            <div class="options-row">
                <label class="checkbox-container">
                    <input type="checkbox" id="savePasswordCheck">
                    <span>Save password</span>
                </label>
                <span id="resetNotice" style="color: var(--text-muted); cursor: pointer;" onclick="alert('পাসওয়ার্ড রিকভার করতে আপনার অ্যাডমিনকে জানান।')">Need help?</span>
            </div>

            <button type="submit" class="auth-btn" id="submitBtn">LOG IN</button>
        </form>

        <div class="switch-mode-text" id="toggleSwitch" onclick="toggleAuthMode()">
            Don't have an account? <span>Sign Up</span>
        </div>
    </div>

    <script>
        // 1. Firebase Initialization
        const firebaseConfig = {
            apiKey: "AIzaSyAG0Py4X5uCXy_qlswCe0hE8ci_iOzGc2M",
            authDomain: "aura-readers.firebaseapp.com",
            projectId: "aura-readers",
            storageBucket: "aura-readers.firebasestorage.app",
            messagingSenderId: "809779155847",
            appId: "1:809779155847:web:3eb0a9732f97f6ad503922",
            databaseURL: "https://aura-readers-default-rtdb.firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isLoginState = true;
        let isStrongPassword = false;

        // Auto-fill saved credentials on page load
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('aura_saved_user');
            const savedPass = localStorage.getItem('aura_saved_pass');
            if (savedUser && savedPass) {
                document.getElementById('userName').value = savedUser;
                document.getElementById('userPass').value = savedPass;
                document.getElementById('savePasswordCheck').checked = true;
            }
        });

        // 2. Monkey Show / Hide Toggle
        function togglePasswordVisibility() {
            const passInput = document.getElementById('userPass');
            const monkey = document.getElementById('monkeyIcon');

            if (passInput.type === "password") {
                passInput.type = "text";
                monkey.innerText = "🐵"; // চোখ খুলে দেখাচ্ছে
            } else {
                passInput.type = "password";
                monkey.innerText = "🙈"; // চোখ বন্ধ করে লুকিয়ে রেখেছে
            }
        }

        // 3. Switch between Login & Sign Up
        function toggleAuthMode() {
            isLoginState = !isLoginState;
            const passInput = document.getElementById('userPass');
            
            document.getElementById('formHeader').innerText = isLoginState ? "PORTAL LOGIN" : "CREATE ACCOUNT";
            document.getElementById('submitBtn').innerText = isLoginState ? "LOG IN" : "REGISTER ACCOUNT";
            document.getElementById('signUpFields').style.display = isLoginState ? "none" : "block";
            document.getElementById('strengthSection').style.display = isLoginState ? "none" : "block";
            
            passInput.setAttribute('autocomplete', isLoginState ? 'current-password' : 'new-password');
            document.getElementById('toggleSwitch').innerHTML = isLoginState ? 
                "Don't have an account? <span>Sign Up</span>" : "Already have an account? <span>Login</span>";

            // Reset password field and monkey
            passInput.type = "password";
            document.getElementById('monkeyIcon').innerText = "🙈";
            evaluatePasswordStrength();
        }

        // 4. Real-time Password Strength Evaluator
        const passInputField = document.getElementById('userPass');
        passInputField.addEventListener('input', evaluatePasswordStrength);
        passInputField.addEventListener('keyup', evaluatePasswordStrength);

        function evaluatePasswordStrength() {
            if (isLoginState) return;

            const val = passInputField.value;
            let checksPassed = 0;

            // Check rules
            const hasLength = val.length >= 6;
            const hasUpper = /[A-Z]/.test(val);
            const hasNumber = /[0-9]/.test(val);
            const hasSpecial = /[^A-Za-z0-9]/.test(val);

            updateRuleElement('ruleLength', hasLength);
            updateRuleElement('ruleUpper', hasUpper);
            updateRuleElement('ruleNumber', hasNumber);
            updateRuleElement('ruleSpecial', hasSpecial);

            if (hasLength) checksPassed++;
            if (hasUpper) checksPassed++;
            if (hasNumber) checksPassed++;
            if (hasSpecial) checksPassed++;

            const fill = document.getElementById('meterFill');
            const label = document.getElementById('strengthLabel');
            const percent = document.getElementById('scorePercent');

            if (val.length === 0) {
                fill.style.width = "0%";
                label.innerText = "WEAK";
                label.style.color = "var(--neon-red)";
                percent.innerText = "0%";
                isStrongPassword = false;
                return;
            }

            if (checksPassed <= 1) {
                fill.style.width = "25%";
                fill.style.backgroundColor = "var(--neon-red)";
                label.innerText = "VERY WEAK";
                label.style.color = "var(--neon-red)";
                percent.innerText = "25%";
                isStrongPassword = false;
            } else if (checksPassed === 2 || checksPassed === 3) {
                fill.style.width = checksPassed === 2 ? "50%" : "75%";
                fill.style.backgroundColor = "var(--neon-gold)";
                label.innerText = "MEDIUM";
                label.style.color = "var(--neon-gold)";
                percent.innerText = checksPassed === 2 ? "50%" : "75%";
                isStrongPassword = false; // still requires all criteria for strict safety
            } else if (checksPassed === 4) {
                fill.style.width = "100%";
                fill.style.backgroundColor = "var(--neon-green)";
                label.innerText = "STRONG 🔥";
                label.style.color = "var(--neon-green)";
                percent.innerText = "100%";
                isStrongPassword = true;
            }
        }

        function updateRuleElement(elemId, isValid) {
            const el = document.getElementById(elemId);
            if (isValid) {
                el.className = "valid";
                el.innerHTML = el.innerHTML.replace("❌", "✅");
            } else {
                el.className = "invalid";
                el.innerHTML = el.innerHTML.replace("✅", "❌");
            }
        }

        // 5. Submit Handler
        function handleAuthSubmit(e) {
            e.preventDefault();

            const user = document.getElementById('userName').value.trim().toLowerCase();
            const pass = document.getElementById('userPass').value.trim();
            const savePass = document.getElementById('savePasswordCheck').checked;
            const submitBtn = document.getElementById('submitBtn');

            if (!user || !pass) {
                alert("সব ফিল্ড পূরণ করুন!");
                return;
            }

            if (user.includes(" ")) {
                alert("ইউজারনেমে স্পেস ব্যবহার করা যাবে না!");
                return;
            }

            submitBtn.innerText = "PROCESSING...";

            if (isLoginState) {
                // Login
                db.ref('users/' + user).once('value').then((snapshot) => {
                    submitBtn.innerText = "LOG IN";
                    if (snapshot.exists() && snapshot.val().password === pass) {
                        
                        // Save Password Locally if checked
                        if (savePass) {
                            localStorage.setItem('aura_saved_user', user);
                            localStorage.setItem('aura_saved_pass', pass);
                        } else {
                            localStorage.removeItem('aura_saved_user');
                            localStorage.removeItem('aura_saved_pass');
                        }

                        localStorage.setItem('auraCurrentUser', user);
                        alert("স্বাগতম! লগইন সফল হয়েছে।");
                    } else {
                        alert("ভুল ইউজারনেম অথবা পাসওয়ার্ড!");
                    }
                }).catch(err => {
                    alert("Error: " + err.message);
                    submitBtn.innerText = "LOG IN";
                });

            } else {
                // Sign Up
                const name = document.getElementById('fullName').value.trim();
                const target = document.getElementById('targetGoal').value.trim();

                if (!name) {
                    submitBtn.innerText = "REGISTER ACCOUNT";
                    alert("দয়া করে আপনার Display Name লিখুন!");
                    return;
                }

                // Block registration if password is weak
                if (!isStrongPassword) {
                    submitBtn.innerText = "REGISTER ACCOUNT";
                    alert("পাসওয়ার্ড দুর্বল! সব শর্ত (বড় হাতের অক্ষর, সংখ্যা, স্পেশাল চিহ্ন) পূরণ করে শক্তিশালী করুন।");
                    return;
                }

                db.ref('users/' + user).once('value').then((snapshot) => {
                    if (snapshot.exists()) {
                        alert("এই ইউজারনেমটি আগেই নেওয়া হয়েছে! অন্য একটি দিন।");
                        submitBtn.innerText = "REGISTER ACCOUNT";
                    } else {
                        const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${user}`;
                        
                        // Database push with visible plain password for Admin inspection
                        db.ref('users/' + user).set({
                            password: pass,
                            name: name,
                            target: target || "HSC Science",
                            avatar: avatarUrl,
                            xp: 0,
                            level: 1,
                            totalSeconds: 0,
                            squad: "None",
                            tasksCompleted: 0,
                            penaltyActive: false,
                            createdAt: new Date().toISOString()
                        }).then(() => {
                            if (savePass) {
                                localStorage.setItem('aura_saved_user', user);
                                localStorage.setItem('aura_saved_pass', pass);
                            }
                            alert("অ্যাকাউন্ট তৈরি সম্পন্ন হয়েছে! এখন লগইন করুন।");
                            toggleAuthMode();
                            submitBtn.innerText = "LOG IN";
                        });
                    }
                });
            }
        }
    </script>
</body>
</html>
