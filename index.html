<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura FFX - Login</title>
    
    <!-- Firebase SDKs (Compat version for simple HTML integration) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        body {
            background-color: #050b14; color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0;
        }
        .login-box {
            background: linear-gradient(145deg, #0a1325, #070d1a);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 15px; padding: 30px;
            width: 320px; box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
            text-align: center;
        }
        .title { color: #00f0ff; font-size: 24px; font-weight: 900; margin-bottom: 20px; text-transform: uppercase; }
        input {
            width: 100%; background: #050b14; border: 1px solid #8892b0;
            color: #fff; padding: 12px; border-radius: 5px;
            margin-bottom: 15px; box-sizing: border-box;
        }
        input:focus { border-color: #00f0ff; outline: none; }
        .pass-container { position: relative; }
        .show-pass {
            position: absolute; right: 10px; top: 12px;
            color: #00f0ff; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .btn {
            background: #00f0ff; color: #000; border: none;
            padding: 12px; border-radius: 6px; font-weight: bold;
            cursor: pointer; width: 100%; text-transform: uppercase; transition: 0.3s;
        }
        .btn:hover { background: #fff; box-shadow: 0 0 10px #00f0ff; }
        .toggle-text {
            color: #8892b0; font-size: 13px; margin-top: 15px; cursor: pointer;
        }
        .toggle-text span { color: #00f0ff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="title" id="formTitle">SYSTEM LOGIN</div>
        
        <div id="signupFields" style="display: none;">
            <input type="text" id="name" placeholder="Display Name (e.g. 2x Sadik)">
            <input type="text" id="target" placeholder="Target (e.g. BUET/DMC)">
        </div>

        <input type="text" id="username" placeholder="Username (No spaces)">
        
        <div class="pass-container">
            <input type="password" id="password" placeholder="Password">
            <div class="show-pass" onclick="togglePass()">SHOW</div>
        </div>

        <button class="btn" id="actionBtn" onclick="processAuth()">LOGIN</button>
        
        <div class="toggle-text" id="toggleAuth" onclick="switchMode()">
            Don't have an account? <span>Sign Up</span>
        </div>
    </div>

    <script>
        // আপনার দেওয়া ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyAG0Py4X5uCXy_qlswCe0hE8ci_iOzGc2M",
            authDomain: "aura-readers.firebaseapp.com",
            projectId: "aura-readers",
            storageBucket: "aura-readers.firebasestorage.app",
            messagingSenderId: "809779155847",
            appId: "1:809779155847:web:3eb0a9732f97f6ad503922",
            // Realtime Database URL (অবশ্যই দিতে হবে)
            databaseURL: "https://aura-readers-default-rtdb.firebaseio.com" 
        };
        
        // ফায়ারবেস চালু করা
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isLogin = true;

        function switchMode() {
            isLogin = !isLogin;
            document.getElementById('formTitle').innerText = isLogin ? "SYSTEM LOGIN" : "CREATE ACCOUNT";
            document.getElementById('actionBtn').innerText = isLogin ? "LOGIN" : "SIGN UP";
            document.getElementById('signupFields').style.display = isLogin ? "none" : "block";
            document.getElementById('toggleAuth').innerHTML = isLogin ? 
                "Don't have an account? <span>Sign Up</span>" : "Already have an account? <span>Login</span>";
        }

        function togglePass() {
            let passInput = document.getElementById('password');
            let showBtn = document.querySelector('.show-pass');
            if (passInput.type === "password") {
                passInput.type = "text";
                showBtn.innerText = "HIDE";
            } else {
                passInput.type = "password";
                showBtn.innerText = "SHOW";
            }
        }

        function processAuth() {
            let user = document.getElementById('username').value.trim().toLowerCase();
            let pass = document.getElementById('password').value.trim();

            if (user === "" || pass === "") return alert("Username and Password are required!");
            if (user.includes(" ")) return alert("Username cannot contain spaces!");

            let actionBtn = document.getElementById('actionBtn');
            actionBtn.innerText = "PROCESSING...";

            if (isLogin) {
                // Login Logic
                db.ref('users/' + user).once('value').then((snapshot) => {
                    actionBtn.innerText = "LOGIN";
                    if (snapshot.exists() && snapshot.val().password === pass) {
                        localStorage.setItem('auraCurrentUser', user);
                        alert("Login Successful! Welcome to Aura.");
                        // মূল পেজে রিডাইরেক্ট (পরে এই পেজটি বানাবো)
                        // window.location.href = "app.html"; 
                    } else {
                        alert("Invalid Username or Password!");
                    }
                }).catch(error => {
                    alert("Error: " + error.message);
                    actionBtn.innerText = "LOGIN";
                });
            } else {
                // Signup Logic
                let name = document.getElementById('name').value.trim();
                let target = document.getElementById('target').value.trim();
                
                if (name === "") {
                    actionBtn.innerText = "SIGN UP";
                    return alert("Display name is required!");
                }

                let avatarUrl = `https://api.dicebear.com/7.x/avataaars/svg?seed=${user}`;

                db.ref('users/' + user).once('value').then((snapshot) => {
                    if (snapshot.exists()) {
                        alert("Username already taken! Choose another one.");
                        actionBtn.innerText = "SIGN UP";
                    } else {
                        db.ref('users/' + user).set({
                            password: pass, // অ্যাডমিন দেখার জন্য প্লেইন টেক্সট
                            name: name,
                            target: target || "Undecided",
                            avatar: avatarUrl,
                            xp: 0,
                            level: 1,
                            totalSeconds: 0,
                            squad: "None",
                            tasksCompleted: 0,
                            joinedAt: new Date().toISOString()
                        }).then(() => {
                            alert("Account Created Successfully! Please login.");
                            switchMode();
                            actionBtn.innerText = "LOGIN";
                            document.getElementById('password').value = "";
                        });
                    }
                });
            }
        }
    </script>
</body>
</html>
